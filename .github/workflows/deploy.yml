name: CI / CD -> Deploy to EC2

on:
  push:
    branches: ["feature/drishti-customizations"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/feature/drishti-customizations'
    timeout-minutes: 10

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Ensure drishti-network exists
            docker network create drishti-network || true

            # Login to GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Lowercase the repository name (Docker requires lowercase)
            REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Pull the latest image
            docker pull ghcr.io/$REPO_NAME:latest

            # Stop and remove the existing container if it exists
            docker stop drishti-observability-web || true
            docker rm drishti-observability-web || true

            # Run the new container
            docker run -d \
              --name drishti-observability-web \
              --restart unless-stopped \
              --network drishti-network \
              -p 3002:3000 \
              -e NODE_ENV=production \
              -e MONGODB_URI=${{ secrets.OBSERVABILITY_MONGODB_URI }} \
              -e REDIS_URL=${{ secrets.OBSERVABILITY_REDIS_URL }} \
              -e JWT_SECRET=${{ secrets.OBSERVABILITY_JWT_SECRET }} \
              -e GITHUB_CLIENT_ID=${{ secrets.OBSERVABILITY_GITHUB_CLIENT_ID }} \
              -e GITHUB_CLIENT_SECRET=${{ secrets.OBSERVABILITY_GITHUB_CLIENT_SECRET }} \
              -e NEXT_PUBLIC_APP_URL=${{ secrets.OBSERVABILITY_APP_URL }} \
              -e CRON_SECRET=${{ secrets.OBSERVABILITY_CRON_SECRET }} \
              ghcr.io/$REPO_NAME:latest

            # Cleanup unused images
            docker image prune -f
